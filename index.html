<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Yatzy</title>
        <!-- Fonts -->
         <link rel="preconnect" href="https://fonts.googleapis.com">
         <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
         <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
         <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="app">
          
            <!--HEADER: title, total score chip, round counter + progress bar-->
            <header class="app-header">
                <h1>Yatzy</h1>
                <div class="score-chip">
                    <strong id="total-score">0</strong>
                    <span>Total score</span>
                </div>

                <div class="round-info">
                    <p id ="round-text">Round 1 of 15</p>
                    <!--Bar width for rounds completed (6 of 15 = 40%) -->
                    <div class="round-bar" id="round-bar" role="progressbar" aria-label="Rounds completed"
                            aria-valuemin="0" aria-valuemax="15" aria-valuenow="0">
                        <span id="round-fill" style="width: 0%"></span>
                    </div>
                </div>
            </header>

            <main class="play-area">
                <!--GAME BOARD: roll meter, dice, buttons message -->
                <section class="panel board" aria-labelledby="board-title">
                    <h2 id="board-title">Your roll</h2>

                    <!--Rolls used this turn (filled by main.js ) -->
                    <div class="roll-meter" id="roll-meter"></div>

                    <!--Dice tray (filled by main.js ) -->
                    <ul class="dice-tray" id="dice-tray"></ul>

                    <!--Main actions -->
                    <div class="controls">
                        <button class="btn btn-primary" id="roll-btn">Roll dice</button>
                    <button class ="btn btn-secondary" id="score-btn" disabled>Pick a category</button>
                    </div>

                    <!--Live message area: tells the player what just happened -->
                    <div class="message" id="message" role="status"></div>
                </section>
                
                <!-- Scorecard: rows are generated by main.js-->
                 <section class="panel scorecard" aria-labelledby="card-title">
                    <table class="score-table">
                        <caption id="card-title">Scorecard</caption>
                        <thead>
                            <tr>
                                <th scope="col">Category</th>
                                <th scope="col" class="rule">How it scores</th>
                                <th scope="col" class="num">Score</th>
                            </tr>
                        </thead>
                        <tbody id ="score-body"></tbody>
                    </table>
                </section>
            </main>

            <!-- GAME OVER: hidden until round 15 is scored -->
             <section id="gameover" class="gameover" aria-labelledby="over-title" hidden>
                <h2 id="over-title">Game over</h2>
                <p id="over-message"></p>
                <div class="final" id="over-final">0</div>
                <dl>
                    <dt>Upper total</dt><dd id="over-upper">0</dd>
                    <dt>Bonus</dt><dd id="over-bonus">0</dd>
                    <dt>Lower section</dt><dd id="over-lower">0</dd>
                    <dt>Best score</dt><dd id="over-best">0</dd>
                </dl>
                <button class="btn btn-primary" id="again-btn">Play again</button>
            </section>
        </div>
<script src="dice.js"></script>
<script src="yatzy_engine.js"></script>
<script src="yatzy_game.js"></script>
<script src="main.js"></script>
</body>
</html>
